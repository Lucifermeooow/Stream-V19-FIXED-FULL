      - name: Build Stream V19 APK
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
        run: |
          set -e

          echo "========================================"
          echo "BUILD STREAM V19"
          echo "========================================"

          cd "$GITHUB_WORKSPACE"

          flutter clean
          flutter pub get
          flutter precache --android

          echo ""
          echo "Building APK..."

          flutter build apk --release

          echo ""
          echo "========================================"
          echo "APK SEARCH"
          echo "========================================"

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$GITHUB_WORKSPACE/build" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: No APK found."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifacts/Stream-V19-release.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/artifacts/Stream-V19-release.apk"
